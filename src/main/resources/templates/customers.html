<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Hotellbokning</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<h1>Sidan för kunder</h1>
<table>
    <tr>
        <th>Booking</th>
        <th>Room</th>
        <th>Date</th>
    </tr>
    <tr th:each="booking : ${bookings}">
        <td th:text="${booking.getId()}"></td>
        <td th:text="*{booking.getRoom().getRoomNr()}"></td>
        <td th:text="${booking.getStartDate()}"></td>
    </tr>

    <!--    <tr th:each="book : "></tr>-->
</table>

<a href="/">Till startsidan</a>
</body>
</html>
