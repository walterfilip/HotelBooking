<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Hotellbokning</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div class="customer-form-container">
<h1>Kundformulär</h1>

    <form th:action="@{/customers/booking}" method="post">


        <div class="customer-contact-input">
            <label for="firstName">Förnamn</label>
            <input type="text"
                   id="firstName"
                   name="firstName"
                   required>
        </div>

        <div class="customer-contact-input">
            <label for="lastName">Efternamn</label>
            <input type="text"
                   id="lastName"
                   name="lastName"
                   required>
        </div>

        <div class="customer-contact-input">
            <label for="email">E-post</label>
            <input type="text"
                   id="email"
                   name="email"
                   required>
        </div>

        <div class="customer-contact-input">
            <label for="phoneNumber">Telefonnummer</label>
            <input type="text"
                   id="phoneNumber"
                   name="phoneNumber"
                   required>
        </div>

        <!-- Inputs från bokningen som följer med hidden -->
        <input type="hidden"
               name="roomId"
               th:value="${roomId}">

        <input type="hidden"
               name="startDate"
               th:value="${startDate}">

        <input type="hidden"
               name="endDate"
               th:value="${endDate}">

        <input type="hidden"
               name="extraBed"
               th:value="${extraBed}">

        <button type="submit">Registrera och fortsätt</button>

    </form>

<a href="/">Till startsidan</a>
</div>
</body>
</html>
