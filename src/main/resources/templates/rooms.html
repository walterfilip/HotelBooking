<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Hotellbokning</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div class="rooms-container">
<h1>Tillgängliga Rum</h1>

<table>
    <thead>
    <tr>
        <th>Rumstyp</th>
        <th>Pris per natt</th>
        <th>Boka</th>
    </tr>
    </thead>

   <tbody>
   <tr th:each="room : ${rooms}">
     <td>
         <span th:text="${room.roomType.name() == 'SINGLE' ? 'Enkelrum' : 'Dubbelrum'}"></span>
         <span th:text="' (' + ${room.description} + ')'"></span>
     </td>
       <td th:text="${room.price} + ' kr'"></td>

       <td>
           <!-- skippar customer formen bara för att testa booking implementation
           <a th:href="@{/customers/form}">
               Boka rum
           </a>
           -->
           <form th:action="@{/bookings}" method="post">

               <input
                       type="hidden"
                       name="roomId"
                       th:value="${room.id}">

               <!--CustomerId hårdkodad till 1 just nu -->
               <input
                       type="hidden"
                       name="customerId"
                       value="1">

               <input
                       type="hidden"
                       name="startDate"
                       th:value="${startDate}">

               <input
                       type="hidden"
                       name="endDate"
                       th:value="${endDate}">

               <button type="submit">
                   Boka rum

               </button>

           </form>
       </td>

   </tr>
   </tbody>
</table>

<a href="/">Till startsidan</a>
</div>
</body>
</html>
